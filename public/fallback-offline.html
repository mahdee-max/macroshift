<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacroShift — Offline</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background-color: #f5f3ff;
        color: #1c1b1f;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .container {
        text-align: center;
        max-width: 400px;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background-color: #e0e7ff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 40px;
        height: 40px;
        color: #4f46e5;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: #4f46e5;
        margin-bottom: 8px;
      }

      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #312e81;
        margin-bottom: 16px;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #49454f;
        margin-bottom: 32px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background-color: #e0e7ff;
        color: #4f46e5;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #059669;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z"
          />
        </svg>
      </div>
      <h1>MacroShift</h1>
      <h2>You're offline</h2>
      <p>
        Your data is saved locally and will sync when you reconnect. You can
        still view your cached meals and progress.
      </p>
      <div class="badge">
        <span class="dot"></span>
        Data saved locally
      </div>
    </div>
  </body>
</html>
